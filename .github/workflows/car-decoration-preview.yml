# Car Decoration release preview (PR #8). Builds the Cloudflare PREVIEW Worker
# from a throwaway Postgres 17 database: the repository's own audit fixture
# (scripts/audit/local-fixture.mjs: every migration and the catalogue as
# fixture records) with the Car Decoration seed applied and published. No
# production or staging data is read or written for the build.
# Results: check runs "Cloudflare preview evidence" (preview-pipeline.mjs) and
# "Car decoration preview checks". Remove this file after the release.
name: Car decoration preview

on:
  push:
    branches: [feature/car-decoration]

permissions:
  contents: read
  checks: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency: { group: cloudflare-preview, cancel-in-progress: false }
    services:
      clone:
        image: postgres:17
        env: { POSTGRES_PASSWORD: local-audit-only, POSTGRES_DB: freshpetals_audit }
        ports: ["55437:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HYPERDRIVE_ORIGIN_URL: ${{ secrets.HYPERDRIVE_ORIGIN_URL }}
      SITE_URL: https://onlyfreshpetals.in
      GITHUB_TOKEN: ${{ github.token }}
      WRANGLER_SEND_METRICS: "false"
      DATABASE_URL: postgresql://postgres:local-audit-only@127.0.0.1:55437/freshpetals_audit
      FIXTURE: data/focused-audit-2026-10-07/workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Fixture database and isolated build copy
        run: |
          exec > >(tee -a "$RUNNER_TEMP/steps.log") 2>&1
          echo '== fixture'
          node scripts/audit/local-fixture.mjs prepare
          # The fixture lists every catalogue product under a fixture category: remove the Car Decoration
          # slugs so the seed creates them as it will in production.
          node -e "import('./scripts/audit/source-loader.mjs').then(m=>console.log(m.sourceLoader()('src/data/productCatalog.ts').productCatalog.filter(p=>p.category==='Car Decoration').map(p=>p.slug).join(',')))" > "$RUNNER_TEMP/slugs"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "delete from products where slug = any(string_to_array('$(cat "$RUNNER_TEMP/slugs")', ','))"
      - name: Seed lifecycle, then apply (twice) and publish
        run: |
          exec > >(tee -a "$RUNNER_TEMP/steps.log") 2>&1
          echo '== seed'
          node scripts/audit/car-seed-lifecycle.mjs
          node scripts/seed-car-decoration.mjs plan
          node scripts/seed-car-decoration.mjs apply
          node scripts/seed-car-decoration.mjs apply
          node scripts/seed-car-decoration.mjs publish
      - name: Cloudflare preview (build from the fixture database, deploy, checks)
        # In the fixture copy, whose database client connects to the loopback database without TLS.
        run: |
          exec > >(tee -a "$RUNNER_TEMP/steps.log") 2>&1
          echo '== preview pipeline'
          cd "$FIXTURE" && node scripts/cloudflare/preview-pipeline.mjs
      - name: Car decoration checks on the preview
        if: always()
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r .result.subdomain)
          url="https://fresh-petals-preview.$sub.workers.dev"
          set +e
          node scripts/audit/car-live-checks.mjs "$url" --browser > "$RUNNER_TEMP/car.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/car.txt"
          conclusion=$([ $code -eq 0 ] && echo success || echo failure)
          jq -n --arg sha "$GITHUB_SHA" --arg c "$conclusion" --arg t "$(tail -c 60000 "$RUNNER_TEMP/car.txt")" \
            '{name:"Car decoration preview checks", head_sha:$sha, status:"completed", conclusion:$c, output:{title:"Car decoration on the preview Worker", summary:($t|split("\n")|last // ""), text:("```\n"+$t+"\n```")}}' \
            | gh api "repos/$GITHUB_REPOSITORY/check-runs" --input - > /dev/null
          exit $code
      - name: Step log as a check run
        if: always()
        run: |
          sed -E 's#postgres(ql)?://[^ ]+#[redacted]#g' "$RUNNER_TEMP/steps.log" | tail -c 60000 > "$RUNNER_TEMP/out.txt" || true
          jq -n --arg sha "$GITHUB_SHA" --rawfile t "$RUNNER_TEMP/out.txt" '{name:"Car decoration preview log", head_sha:$sha, status:"completed", conclusion:"neutral", output:{title:"Step log", summary:"Fixture, seed and preview pipeline output (tail).", text:("```\n"+$t+"\n```")}}' | gh api "repos/$GITHUB_REPOSITORY/check-runs" --input - > /dev/null
